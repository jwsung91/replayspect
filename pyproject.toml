[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "replayspect"
version = "0.0.1"
description = "Replay protocol failures exactly, then inspect them against a behavioural contract."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/jwsung91/replayspect"

[tool.hatch.build.targets.wheel]
packages = ["src/replayspect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["slow: sweeps over many seeds; excluded by default, run with -m \"\""]
addopts = "-m 'not slow'"
