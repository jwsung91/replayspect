# Candidate P4 (not in rules.yaml): the state change that starts the action only after the effect that starts it, per request id.
protocol: turntable.v0

contracts:
  - id: P4
    desc: the state becomes TURNING_TO_LEFT, TURNING_TO_RIGHT or TURNING_TO_INITIAL for a req_id only after its motor_start
    kind: only_after
    per: req_id
    event: device.state(TURNING_TO_LEFT|TURNING_TO_RIGHT|TURNING_TO_INITIAL)
    after: device.effect(motor_start)
    grade: generic
    source:
      rule: P4
      quote: "the state change that starts the action only after the effect that starts it, per request id"
